<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela 1 - Trajetória Acadêmica e Profissional</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
    }

    table {
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      color: #000;
      border: 1px solid #000;
      border-spacing: 2px;
    }

    caption {
      margin-bottom: 4px;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 6px;
    }

    th {
      text-align: center;
    }

    td {
      text-align: left;
    }
  </style>
</head>
<body>

  <table>
    <caption>Trajetória Acadêmica e Profissional</caption>
    <thead>
      <tr>
        <th rowspan="2">Estudante</th>
        <th colspan="2">Formação</th>
        <th rowspan="2">Ano de<br>Conclusão</th>
      </tr>
      <tr>
        <th>Graduação</th>
        <th>Pós-graduação</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>José</th>
        <td>Ciência da Computação</td>
        <td>Inteligência Artificial</td>
        <td>2023</td>
      </tr>
      <tr>
        <th>Ana</th>
        <td>Engenharia de Software</td>
        <td>Gestão de Projetos</td>
        <td>2022</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
